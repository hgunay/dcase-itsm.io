<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>body{margin:0;} a{color:inherit;text-decoration:none;} a:hover{color:#08748e;}</style>
</helmet>
<div style="height:49px;box-sizing:border-box;border-bottom:1px solid {{ line }};background:{{ bg }};display:flex;align-items:center;gap:8px;padding:0 8px;font-family:Inter,system-ui,sans-serif;color:{{ fg }}">
<div style="display:flex;align-items:center;gap:10px;padding-left:8px;width:{{ solW }};flex-shrink:0">
<button type="button" onClick="{{ menu }}" title="Menüyü aç / daralt" aria-label="Menü" style="width:32px;height:32px;margin-left:-8px;border:0;background:transparent;color:inherit;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0;flex-shrink:0" style-hover="background:{{ activeBg }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"></rect><path d="M9 3v18"></path></svg></button>
<span style="width:1px;height:16px;background:{{ line }}"></span>
<a href="../Prototipler.dc.html" style="display:inline-flex;align-items:center;gap:6px;padding-left:4px">
<span style="width:22px;height:22px;border-radius:6px;border:2px solid {{ logo }};display:inline-flex;align-items:center;justify-content:center;color:{{ logo }};font-weight:800;font-size:12px;box-sizing:border-box">D</span>
<span style="font-weight:700;font-size:15px;letter-spacing:-.01em">Dcase</span><span style="font-weight:600;font-size:11px;color:{{ muted }}">ITSM</span>
</a>
</div>
<nav style="display:flex;align-items:center;flex:1;min-width:0;overflow:hidden;gap:4px">
<a href="#" style="height:32px;padding:0 8px;display:inline-flex;align-items:center;font-size:14px;border-radius:6px;white-space:nowrap;background:{{ activeBg }};color:{{ activeFg }};font-weight:600">HelpDesk</a><sc-if value="{{ genis }}" hint-placeholder-val="{{ true }}"><span style="width:1px;height:16px;background:{{ line }};margin:0 8px"></span>
<a href="#" style="height:32px;padding:0 8px;display:inline-flex;align-items:center;font-size:14px;border-radius:6px;white-space:nowrap;color:{{ navFg }}">Apeiron</a><span style="width:1px;height:16px;background:{{ line }};margin:0 8px"></span>
<a href="#" style="height:32px;padding:0 8px;display:inline-flex;align-items:center;font-size:14px;border-radius:6px;white-space:nowrap;color:{{ navFg }}">HelpDesk English</a><span style="width:1px;height:16px;background:{{ line }};margin:0 8px"></span>
<a href="#" style="height:32px;padding:0 8px;display:inline-flex;align-items:center;font-size:14px;border-radius:6px;white-space:nowrap;color:{{ navFg }}">AI</a></sc-if>
</nav>
<button type="button" style="margin-left:auto;height:32px;padding:0 12px;border-radius:6px;background:{{ btnBg }};border:1px solid {{ btnLine }};box-shadow:0 1px 2px rgba(2,6,24,.05);font:inherit;font-size:12px;font-weight:600;color:{{ fg }};display:inline-flex;align-items:center;gap:6px;cursor:pointer;flex-shrink:0">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 7 8.7 2.7a2.41 2.41 0 0 0-3.4 0L2.7 5.3a2.41 2.41 0 0 0 0 3.4L7 13"></path><path d="m8 6 2-2"></path><path d="m18 16 2-2"></path><path d="m17 11 4.3 4.3c.94.94.94 2.46 0 3.4l-2.6 2.6c-.94.94-2.46.94-3.4 0L11 17"></path><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg>
<sc-if value="{{ genis }}" hint-placeholder-val="{{ true }}"><span>Customize</span></sc-if></button>
<span style="width:1px;height:16px;background:{{ line }};margin-left:8px;flex-shrink:0"></span>
<div style="display:flex;align-items:center;gap:4px;padding:0 4px;flex-shrink:0">
<span style="width:36px;height:36px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:{{ fg }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2"></path><path d="M12 20v2"></path><path d="m4.93 4.93 1.41 1.41"></path><path d="m17.66 17.66 1.41 1.41"></path><path d="M2 12h2"></path><path d="M20 12h2"></path><path d="m6.34 17.66-1.41 1.41"></path><path d="m19.07 4.93-1.41 1.41"></path></svg></span>
<span style="width:36px;height:36px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;color:{{ fg }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"></path></svg></span>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;tema&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;acik&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;acik&quot;,&quot;koyu&quot;],&quot;section&quot;:&quot;Üst bar&quot;}}">
class Component extends DCLogic {
  state = { vw: window.innerWidth, menuMode: null };
  componentDidMount() {
    this._rs = () => this.setState({ vw: window.innerWidth });
    this._mm = ev => this.setState({ menuMode: ev.detail && ev.detail.mode });
    window.addEventListener('resize', this._rs); window.addEventListener('dcase:menu-mode', this._mm);
  }
  componentWillUnmount() { window.removeEventListener('resize', this._rs); window.removeEventListener('dcase:menu-mode', this._mm); }
  renderVals() {
    const koyu = (this.props.tema ?? 'acik') === 'koyu';
    const vw = this.state.vw;
    const mode = this.state.menuMode || (vw >= 1200 ? 'tam' : vw >= 800 ? 'dar' : 'gizli');
    const tema = koyu
      ? { bg: '#020618', fg: '#f8fafc', line: 'rgba(255,255,255,.12)', logo: '#2fb3c9', muted: '#94a3b8', navFg: '#cbd5e1', activeBg: 'rgba(255,255,255,.08)', activeFg: '#fff', btnBg: 'rgba(255,255,255,.08)', btnLine: 'rgba(255,255,255,.14)' }
      : { bg: '#fff', fg: '#020618', line: '#e2e8f0', logo: '#08748e', muted: '#475569', navFg: '#020618', activeBg: '#f1f5f9', activeFg: '#020618', btnBg: '#f1f5f9', btnLine: '#e2e8f0' };
    return { ...tema, solW: mode === 'tam' ? '236px' : 'auto', genis: vw >= 1000, menu: () => window.dispatchEvent(new CustomEvent('dcase:menu')) };
  }
}
</script>
</body>
</html>
